spring:
  application:
    name: API-Gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lowercase-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**
          filters:
            - CustomRouteFilter
app.jwt:
  secret: MySuperSecretKeyForJWTGeneration123456789
  expiration: 86400000

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
